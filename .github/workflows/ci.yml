name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET version
        run: dotnet --info

      - name: Restore
        run: dotnet restore RAG-in-DotNet.slnx

      - name: Build
        run: dotnet build RAG-in-DotNet.slnx --configuration Release --no-restore -warnAsError

      - name: Test
        run: dotnet test RAG-in-DotNet.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  format:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore (needed for analyzers)
        run: dotnet restore RAG-in-DotNet.slnx
      - name: Format check
        run: dotnet format RAG-in-DotNet.slnx --verify-no-changes --severity warn
