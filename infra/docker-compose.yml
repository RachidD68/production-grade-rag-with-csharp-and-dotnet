# =============================================================================
#  RAG in .NET — Local development stack
# =============================================================================
#  Services:
#    - qdrant            : vector database (Ch 6+)
#    - neo4j             : graph database (Ch 13+)
#    - redis             : distributed cache (Ch 21)
#    - ollama            : local LLM + embedding host (Ch 1+, fallback for Azure OpenAI)
#    - ollama-init       : sidecar that pulls nomic-embed-text + llama3.2 on first start
#    - aspire-dashboard  : OpenTelemetry receiver / dashboard (Ch 21)
#
#  Usage:
#    cp .env.example .env       # set NEO4J_PASSWORD etc.
#    docker compose up -d
#    docker compose ps          # confirm all services healthy
#    docker compose down        # stop (keeps data volumes)
#    docker compose down -v     # stop + delete volumes (full reset)
# =============================================================================

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 5<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.28-community
    container_name: rag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP (browser)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-rag-in-dotnet}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-rag-in-dotnet} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama-init:
    # Sidecar that pulls the two models the book uses by default.
    # Runs once and exits; rerunning `docker compose up -d` is a no-op since
    # `ollama pull` is idempotent against the cached models.
    image: ollama/ollama:latest
    container_name: rag-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Pulling embedding model nomic-embed-text..."
        ollama pull nomic-embed-text || exit 1
        echo "Pulling chat model llama3.2..."
        ollama pull llama3.2 || exit 1
        echo "Models ready."
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: rag-aspire-dashboard
    restart: unless-stopped
    ports:
      - "18888:18888"   # dashboard UI
      - "18889:18889"   # OTLP HTTP receiver
      - "4317:18889"    # OTLP gRPC receiver alias
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: "http://0.0.0.0:18889"

volumes:
  qdrant-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  redis-data:
  ollama-data:
